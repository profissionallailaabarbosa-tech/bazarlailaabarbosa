name: Sync Pending Payments

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call payment sync endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SYNC_URL: https://bazarlailaabarbosa.vercel.app/api/cron/sync-pending-payments
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is missing."
            exit 1
          fi

          curl --fail --show-error --silent \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SYNC_URL"
